<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>TNTBus - Login</title>
<!-- Material Symbols -->

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-feature-settings: 'liga';
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;

                            "surface-variant": "#333535",
                            "on-primary-fixed-variant": "#494900",
                            "on-primary-container": "#686800",
                            "tertiary-fixed-dim": "#c8c6c5",
                            "inverse-on-surface": "#2f3131",
                            "outline-variant": "#484831",
                            "primary-fixed": "#eaea00",
                            "tertiary": "#ffffff",
                            "on-tertiary": "#313030",

                            "surface-container": "#1e2020",
                            "on-secondary-container": "#b5b5b5",

                            "on-error": "#690005",
                            "primary-container": "#eaea00",

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- JSON Component: TopAppBar -->
<header class="flex items-center justify-between px-container-margin h-16 w-full bg-surface dark:bg-surface border-b-2 border-surface-variant z-50 docked full-width top-0">
<button aria-label="Go back" class="hover:opacity-80 transition-opacity flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined text-primary dark:text-primary">arrow_back</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary dark:text-primary tracking-tighter uppercase">
            TNTBus
        </div>
<div class="w-10"></div> <!-- Spacer to center the logo perfectly -->
</header>
<!-- Main Content Canvas (Transactional - Suppress Navigation Shells) -->
<main class="flex-grow flex flex-col justify-center items-center px-container-margin py-stack-lg">
<div class="w-full max-w-[420px] flex flex-col gap-stack-lg">
<!-- Headline Section -->
<div class="text-left md:text-center w-full">
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight mb-stack-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-secondary">Log in to manage your bookings and find your next ride.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Email Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-bold text-label-bold text-primary-fixed uppercase tracking-wider" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-gutter text-secondary">mail</span>
<input class="w-full bg-surface-container border border-surface-variant rounded-DEFAULT text-on-surface font-body-md py-3 pl-[48px] pr-gutter focus:outline-none focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-all placeholder:text-surface-variant" id="email" placeholder="traveler@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-bold text-label-bold text-primary-fixed uppercase tracking-wider" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-gutter text-secondary">lock</span>
<input class="w-full bg-surface-container border border-surface-variant rounded-DEFAULT text-on-surface font-body-md py-3 pl-[48px] pr-gutter focus:outline-none focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-all placeholder:text-surface-variant" id="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1">
<a class="font-label-bold text-label-sm text-secondary hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary Action Button -->
<button class="w-full mt-stack-sm bg-primary-fixed text-on-primary-fixed font-headline-md text-[18px] leading-tight py-4 rounded-DEFAULT hover:opacity-90 active:scale-95 transition-all duration-100 flex items-center justify-center gap-2 uppercase tracking-wide" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 w-full opacity-60">
<div class="h-px bg-surface-variant flex-grow"></div>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">OR</span>
<div class="h-px bg-surface-variant flex-grow"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-stack-sm w-full">
<button class="w-full bg-transparent border-2 border-surface-variant text-primary font-label-bold text-label-bold py-3 rounded-DEFAULT hover:bg-surface-variant hover:border-surface-bright transition-all flex items-center justify-center gap-3">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<button class="w-full bg-transparent border-2 border-surface-variant text-primary font-label-bold text-label-bold py-3 rounded-DEFAULT hover:bg-surface-variant hover:border-surface-bright transition-all flex items-center justify-center gap-3">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.29-.88 3.56-.88 1.95.12 3.3.93 4.19 2.18-3.52 2-2.84 6.77.36 8.04-.79 1.4-1.74 2.81-3.19 2.83z"></path>
<path d="M12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.02 4.41-3.74 4.25z"></path>
</svg>
                    Continue with Apple
                </button>
</div>
<!-- Sign Up CTA -->
<div class="text-center mt-stack-md">
<span class="font-body-md text-body-md text-secondary">Don't have an account? </span>
<a class="font-label-bold text-label-bold text-primary-fixed hover:text-primary transition-colors underline decoration-2 underline-offset-4" href="#">Sign Up</a>
</div>
</div>
</main>
</body></html>
