<!DOCTYPE html><html class="dark" lang="en"><head>

<title>My Bookings - TNTBus</title>

<style>
        body { background-color: #121414; color: #e2e2e2; }
    </style>
</head>
<body class="bg-background dark:bg-background text-on-surface antialiased min-h-screen flex flex-col pb-[80px] md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-background dark:bg-background border-b-2 border-primary-fixed">
<div class="flex justify-between items-center px-container-margin py-stack-md w-full">
<button class="text-primary-fixed dark:text-primary-fixed hover:bg-surface-container-high transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu</span>
</button>
<h1 class="font-headline-xl text-headline-md md:text-headline-xl font-black text-primary-fixed uppercase tracking-tighter">My Bookings</h1>
<button class="text-primary-fixed dark:text-primary-fixed hover:bg-surface-container-high transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-margin py-stack-lg flex flex-col gap-stack-lg max-w-4xl mx-auto w-full">
<!-- Tabs -->
<div class="flex border-b border-surface-container-highest">
<button class="flex-1 pb-unit border-b-2 border-primary-fixed text-primary-fixed font-label-bold text-label-bold" onclick="switchTab('upcoming')">Upcoming</button>
<button class="flex-1 pb-unit border-b-2 border-transparent text-secondary-fixed-dim font-label-bold text-label-bold" onclick="switchTab('past')">Past</button>
</div>
<!-- Upcoming Tab Content -->
<div class="flex flex-col gap-stack-md" id="tab-upcoming">
<!-- Booking Card -->
<div class="bg-[#1A1A1A] p-stack-md rounded flex flex-col gap-stack-sm border border-surface-container-highest relative overflow-hidden">
<div class="flex justify-between items-center mb-unit">
<span class="bg-surface-container text-secondary-fixed-dim px-2 py-1 rounded-sm font-label-sm text-label-sm uppercase tracking-wider">ID: #TB84729</span>
<span class="text-primary-fixed font-label-bold text-label-bold uppercase flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">check_circle</span> Confirmed</span>
</div>
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md md:text-headline-lg font-black text-on-surface">NYC</span>
<span class="text-secondary-fixed-dim font-body-md text-body-md">New York</span>
</div>
<div class="flex-1 flex items-center justify-center px-4 relative">
<div class="h-[2px] bg-surface-container-highest w-full absolute top-1/2 -translate-y-1/2"></div>
<span class="material-symbols-outlined text-primary-fixed relative z-10 bg-[#1A1A1A] px-2" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
</div>
<div class="flex flex-col text-right">
<span class="font-headline-md text-headline-md md:text-headline-lg font-black text-on-surface">BOS</span>
<span class="text-secondary-fixed-dim font-body-md text-body-md">Boston</span>
</div>
</div>
<div class="flex justify-between items-center mt-stack-sm bg-surface-container-low p-stack-sm rounded">
<div class="flex flex-col">
<span class="text-secondary-fixed-dim font-label-sm text-label-sm uppercase">Departure</span>
<span class="text-primary-fixed font-label-bold text-body-lg font-bold">Oct 28 • 08:00 AM</span>
</div>
</div>
<button class="w-full mt-stack-md bg-primary-fixed text-on-primary-fixed font-label-bold text-label-bold py-3 rounded active:scale-95 transition-transform duration-100 uppercase tracking-widest">
                    View Ticket
                </button>
</div>
</div>
<!-- Past Tab Content -->
<div class="hidden flex-col gap-stack-md" id="tab-past">
<!-- Past Booking Card -->
<div class="bg-[#1A1A1A] p-stack-md rounded flex flex-col gap-stack-sm border border-surface-container-highest opacity-75">
<div class="flex justify-between items-center mb-unit">
<span class="text-secondary-fixed-dim font-label-sm text-label-sm">Oct 10, 2023</span>
<span class="text-secondary-fixed-dim font-label-bold text-label-bold uppercase flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">history</span> Completed</span>
</div>
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="flex flex-col">
<span class="font-headline-md text-body-lg font-bold text-on-surface">PHI</span>
</div>
<span class="material-symbols-outlined text-secondary-fixed-dim text-[16px]">arrow_forward</span>
<div class="flex flex-col">
<span class="font-headline-md text-body-lg font-bold text-on-surface">DC</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 bg-background dark:bg-background border-t-2 border-primary-fixed flex justify-around items-stretch">
<a class="flex flex-col items-center justify-center text-secondary-fixed-dim py-2 w-full hover:bg-surface-container transition-all active:opacity-80" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-bold text-label-bold text-[10px]">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-fixed text-on-primary-fixed rounded-none py-2 w-full hover:bg-surface-container transition-all active:opacity-80" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
<span class="font-label-bold text-label-bold text-[10px]">Bookings</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary-fixed-dim py-2 w-full hover:bg-surface-container transition-all active:opacity-80" href="#">
<span class="material-symbols-outlined mb-1">notifications</span>
<span class="font-label-bold text-label-bold text-[10px]">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary-fixed-dim py-2 w-full hover:bg-surface-container transition-all active:opacity-80" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-bold text-label-bold text-[10px]">Profile</span>
</a>
</nav>
<script>
        function switchTab(tabId) {
            const tabs = ['upcoming', 'past'];
            const buttons = document.querySelectorAll('button.flex-1');
            
            tabs.forEach((id, index) => {
                const el = document.getElementById(`tab-${id}`);
                const btn = buttons[index];
                if (id === tabId) {
                    el.classList.remove('hidden');
                    el.classList.add('flex');
                    btn.classList.replace('border-transparent', 'border-primary-fixed');
                    btn.classList.replace('text-secondary-fixed-dim', 'text-primary-fixed');
                } else {
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                    btn.classList.replace('border-primary-fixed', 'border-transparent');
                    btn.classList.replace('text-primary-fixed', 'text-secondary-fixed-dim');
                }
            });
        }
    </script>
</body></html>
